<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - Service Unavailable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error {
            text-align: center;
        }
        .code {
            font-size: 8rem;
            font-weight: 700;
            color: #1e293b;
            line-height: 1;
            letter-spacing: -0.05em;
        }
        .message {
            font-size: 1.25rem;
            color: #64748b;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="error">
        <div class="code">503</div>
        <div class="message">Service Unavailable</div>
    </div>
</body>
</html>
